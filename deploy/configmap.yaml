# Daemon configuration (mirrors config.example.yaml).
# The facility is hardcoded in the image (booker/config.py: MEDITERANA_ID) — do not set it here.
# Credentials per account are read at runtime from the environment:
#   MEDI_CREDS_<NAME>_NAME = login email
#   MEDI_CREDS_<NAME>_PW   = login password
# The daemon only *skips* an account whose creds are missing — it does not fail to start.
# The env vars are wired to the medi-bucher-creds Secret (created by ExternalSecret from Infisical).
# Credential values MUST never land in this file — keep them in Infisical.
apiVersion: v1
kind: ConfigMap
metadata:
  name: medi-bucher-config
  labels:
    app.kubernetes.io/part-of: medi-bucher
    app.kubernetes.io/name: medi-bucher
data:
  config.yaml: |
    accounts:
      - name: johanna                   # -> MEDI_CREDS_JOHANNA_NAME / MEDI_CREDS_JOHANNA_PW
        timezone: Europe/Berlin         # used to map (day, time) onto the schedule
        targets:
          - name: "Body Pump"           # W1@19:00, trainer Steden Julian, room Kursraum 1
            day: 1                      # 1=Mon..7=Sun
            time: "19:00"               # HH:MM; (name, day, time) is the target identity
            priority: 1                 # lower = attempted first at release
            event_type_id: "10063773-e87c-4afa-ba27-ffd6e6cf9ac4"
          - name: "Body Balance"        # W1@20:00, trainer MEIßGEIER Salina, room Kursraum 1
            day: 1
            time: "20:00"
            priority: 1
            event_type_id: "b70c61a4-3414-4695-a6ab-3fcf714a17a0"
# Creates the medi-bucher-creds Secret from Infisical via ExternalSecrets Operator.
# The ClusterSecretStore "infisical" is cluster-wide; it pulls from Infisical
# (eu.infisical.com, project ocp, environment prod) using the machine identity
# configured in the external-secrets namespace.
#
# Infisical key names MUST match the env-var names used by the config:
#   MEDI_CREDS_<ACCOUNT>_NAME = login email
#   MEDI_CREDS_<ACCOUNT>_PW   = login password
#
# To add a new account:
#   1. Add credentials in Infisical (eu.infisical.com) under the ocp project / prod environment
#   2. Add the matching data entry here (secretKey + remoteRef.key both equal the Infisical key name)
#   3. Add the account to deploy/configmap.yaml under accounts[]
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: medi-bucher-creds
  labels:
    app.kubernetes.io/part-of: medi-bucher
    app.kubernetes.io/name: medi-bucher
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: medi-bucher-creds
    creationPolicy: Owner
  data:
    - secretKey: MEDI_CREDS_JOHANNA_NAME
      remoteRef:
        key: MEDI_CREDS_JOHANNA_NAME
    - secretKey: MEDI_CREDS_JOHANNA_PW
      remoteRef:
        key: MEDI_CREDS_JOHANNA_PW
# Creates the medi-bucher-config Secret from Infisical via ExternalSecrets Operator.
# The ClusterSecretStore "infisical" is cluster-wide; it pulls from Infisical
# (eu.infisical.com, project ocp, environment prod) using the machine identity
# configured in the external-secrets namespace.
#
# Infisical key: MEDI_CONFIG
#   Value: the full config.yaml (accounts, targets, credentials inline).
#   The daemon reads it directly from the mounted secret at /etc/booker/config.yaml.
#
# To update targets or credentials: edit the MEDI_CONFIG value in Infisical,
# the ExternalSecret refreshes within 1h (or trigger a rollout to pick up immediately).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: medi-bucher-config
  labels:
    app.kubernetes.io/part-of: medi-bucher
    app.kubernetes.io/name: medi-bucher
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: medi-bucher-config
    creationPolicy: Owner
  data:
    - secretKey: config.yaml
      remoteRef:
        key: MEDI_CONFIG
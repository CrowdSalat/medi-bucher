[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "booker"
version = "0.1.0"
description = "Automated course-booking daemon for MyWellness"
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "pyyaml",
]

[project.scripts]
booker = "booker.__main__:main"

[tool.setuptools]
packages = ["booker"]